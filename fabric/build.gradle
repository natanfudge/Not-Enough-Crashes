plugins {
    alias(libs.plugins.shadow)
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "Quilt"
        url = "https://maven.quiltmc.org/repository/release/"
    }
    maven {
        name = "modmenu"
        url = "https://maven.terraformersmc.com"
    }
    maven { url = "https://api.modrinth.com/maven" }
}


dependencies {
    implementation libs.fabric.loader
    compileOnly libs.quilt.loader
    runtimeOnly libs.fabric.api

    if (providers.gradleProperty('includeTestMod').isPresent()) {
        runtimeOnly project(':TestFabricMod')
    }

    compileOnly libs.modmenu
    runtimeOnly libs.modmenu

    common(project(':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'runtimeElements')
}

processResources {
    def resourceProperties = [
            version              : project.version,
            minecraft_version    : libs.versions.minecraft.get(),
            fabric_loader_version: libs.versions.fabric.loader.get()
    ]
    inputs.properties resourceProperties

    filesMatching(['fabric.mod.json', 'quilt.mod.json']) {
        expand resourceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

jar {
    from(project(':common').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


plugins.withId('net.darkhax.curseforgegradle') {
    tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        group = 'upload'
        apiToken = providers.gradleProperty('curseforge_api_key')
                .orElse(providers.environmentVariable('CURSEFORGE_TOKEN'))
                .getOrElse('')

        def mainFile = upload(353890, tasks.named('jar'))
        mainFile.releaseType = release_type
        mainFile.addModLoader('Fabric')
        mainFile.addGameVersion(curseforge_mc_version)
        mainFile.addEnvironment('Client', 'Server')
        mainFile.changelogType = 'markdown'
        mainFile.changelog = rootProject.file('changelog.md')
        mainFile.displayName = "$mod_name $total_version Fabric"
    }
}

plugins.withId("com.modrinth.minotaur") {
    modrinth {
        group = "upload"
        token = providers.gradleProperty('modrinth_api_key')
                .orElse(providers.environmentVariable('MODRINTH_TOKEN'))
        projectId = 'yM94ont6'
        versionNumber = total_version + "-fabric" // Will fail if Modrinth has this version already
        versionName = "$mod_name $total_version Fabric"
        uploadFile = jar
        gameVersions = [modrinth_mc_version]
        loaders = ["fabric", "quilt"]
        changelog = rootProject.file("changelog.md").text
        versionType = release_type
    }
}

tasks.register('publishFabric') {
    group = "publishing"
    dependsOn("publishCurseForge", "modrinth")
}
